<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedMeter Pro - 野球 & サッカー速度測定アプリ</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter & Teko -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Teko:wght@500;700&display=swap" rel="stylesheet">
    <style>
        .speed-font {
            font-family: 'Teko', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-['Inter']">

    <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div id="header-icon-bg" class="bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-500/30 transition-colors duration-300">
                    <i id="header-icon" class="fa-solid fa-baseball text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide">SpeedMeter Pro</h1>
                    <p class="text-xs text-slate-400" id="header-subtitle">野球・ピッチング球速測定</p>
                </div>
            </div>
            <div class="flex bg-slate-800 p-1 rounded-xl text-xs font-medium">
                <button id="tab-timer" onclick="switchTab('timer')" class="px-3 py-1.5 rounded-lg transition bg-indigo-600 text-white shadow">
                    <i class="fa-solid fa-stopwatch mr-1"></i> タップ計測
                </button>
                <button id="tab-video" onclick="switchTab('video')" class="px-3 py-1.5 rounded-lg transition text-slate-400 hover:text-white">
                    <i class="fa-solid fa-video mr-1"></i> 動画解析
                </button>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-6">

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col gap-4">
            <!-- Sport Selector Tabs -->
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">スポーツ選択</span>
                <div class="inline-flex rounded-xl bg-slate-950 p-1 border border-slate-800">
                    <button onclick="setSport('baseball')" id="sport-baseball" class="px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-baseball"></i>
                        <span>野球 (ピッチング)</span>
                    </button>
                    <button onclick="setSport('soccer')" id="sport-soccer" class="px-4 py-1.5 rounded-lg text-slate-400 hover:text-white text-xs font-medium transition flex items-center space-x-1.5">
                        <i class="fa-solid fa-futbol"></i>
                        <span>サッカー (シュート)</span>
                    </button>
                </div>
            </div>

            <!-- Distance & Unit Settings -->
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">測定距離</span>
                    <select id="distance-select" onchange="updateDistance()" class="bg-slate-800 border border-slate-700 text-sm rounded-xl px-3 py-1.5 focus:outline-none focus:border-indigo-500">
                        <!-- Options will be populated dynamically by JS based on sport -->
                    </select>
                </div>
                <div id="custom-distance-box" class="hidden items-center space-x-2">
                    <input type="number" id="custom-distance" value="15" step="0.5" class="w-20 bg-slate-800 border border-slate-700 rounded-xl px-3 py-1 text-sm focus:outline-none focus:border-indigo-500" oninput="calculateSpeed()">
                    <span class="text-xs text-slate-400">m</span>
                </div>
                <div class="flex items-center space-x-2">
                    <span class="text-xs text-slate-400">単位:</span>
                    <div class="inline-flex rounded-xl bg-slate-800 p-0.5 text-xs">
                        <button onclick="setUnit('kmh')" id="unit-kmh" class="px-3 py-1 rounded-lg bg-indigo-600 text-white font-medium transition">km/h</button>
                        <button onclick="setUnit('mph')" id="unit-mph" class="px-3 py-1 rounded-lg text-slate-400 hover:text-white transition">mph</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="section-timer" class="flex flex-col gap-6">
            <div id="hero-card" class="bg-gradient-to-br from-slate-900 to-indigo-950/40 border border-slate-800 rounded-3xl p-6 md:p-10 shadow-2xl flex flex-col items-center justify-center text-center relative overflow-hidden transition-all duration-500">
                <div id="bg-watermark" class="absolute -right-10 -top-10 text-indigo-500/5 text-9xl font-bold select-none transition-colors duration-500">
                    <i class="fa-solid fa-baseball"></i>
                </div>

                <div id="speed-label-text" class="text-xs uppercase tracking-widest text-indigo-400 font-semibold mb-2">Measured Pitch Speed</div>
                <div class="flex items-baseline justify-center">
                    <span id="speed-display" class="speed-font text-8xl md:text-9xl font-bold tracking-tight text-white drop-shadow-[0_0_25px_rgba(99,102,241,0.4)]">---</span>
                    <span id="unit-display" class="text-2xl md:text-3xl text-indigo-400 font-semibold ml-2">km/h</span>
                </div>
                <p id="time-taken-display" class="text-xs text-slate-400 mt-1">計測時間: --- 秒</p>

                <!-- Big Interactive Button -->
                <div class="w-full max-w-md mt-8">
                    <button id="action-btn" onclick="handleTimerClick()" class="w-full py-6 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-xl md:text-2xl shadow-xl shadow-indigo-600/30 active:scale-[0.98] transition-all flex items-center justify-center space-x-3">
                        <i id="btn-icon" class="fa-solid fa-circle-play text-2xl"></i>
                        <span id="btn-text">リリースでタップ開始</span>
                    </button>
                    <p id="instruction-hint" class="text-xs text-slate-500 mt-3">💡 ボールを投げた瞬間（リリース）にタップし、キャッチした瞬間に再度タップしてください。</p>
                </div>
            </div>

            <!-- Recent History -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-xl">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-sm font-semibold text-slate-300 flex items-center">
                        <i class="fa-solid fa-clock-rotate-left mr-2 text-indigo-400" id="history-icon-color"></i> 測定履歴
                    </h2>
                    <button onclick="clearHistory()" class="text-xs text-slate-500 hover:text-slate-300 transition">履歴をクリア</button>
                </div>
                <div id="history-list" class="flex gap-2 overflow-x-auto pb-2 scrollbar-thin">
                    <div class="text-xs text-slate-500 italic px-2 py-3">まだ測定データはありません</div>
                </div>
            </div>
        </div>

        <div id="section-video" class="hidden flex-col gap-6">
            <div class="bg-slate-900 border border-slate-800 rounded-3xl p-6 shadow-xl flex flex-col items-center">
                <div class="w-full text-left mb-4">
                    <h2 class="font-bold text-base text-slate-200">動画フレーム解析（スローモーション対応）</h2>
                    <p class="text-xs text-slate-400">スマホで撮影したスロー動画のコマ数（フレーム数）から正確に速度を算出します。</p>
                </div>

                <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-4 items-center bg-slate-950/60 p-4 rounded-2xl border border-slate-800/80 mb-6">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">カメラの撮影フレームレート</label>
                        <select id="video-fps" class="w-full bg-slate-800 border border-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                            <option value="240">240 fps (超スロー)</option>
                            <option value="120" selected>120 fps (スロー)</option>
                            <option value="60">60 fps (標準高画質)</option>
                            <option value="30">30 fps (通常動画)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1" id="video-frame-label">ボールが移動している間のフレーム数</label>
                        <input type="number" id="frame-count" min="1" value="15" class="w-full bg-slate-800 border border-slate-700 text-sm rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>

                <button id="video-calc-btn" onclick="calculateVideoSpeed()" class="w-full max-w-md py-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold shadow-lg shadow-indigo-600/20 transition">
                    フレーム数から計算する
                </button>

                <div id="video-result-box" class="mt-6 text-center hidden">
                    <span class="text-xs text-indigo-400 uppercase tracking-widest font-semibold">算出スピード</span>
                    <div class="speed-font text-6xl font-bold text-white mt-1" id="video-speed-val">---</div>
                </div>
            </div>
        </div>

    </main>

    <footer class="text-center py-6 text-xs text-slate-600 border-t border-slate-900 mt-auto">
        SpeedMeter Pro &copy; 2026 - スポーツ速度測定アプリ
    </footer>

    <script>
        // State Variables
        let currentSport = 'baseball'; // 'baseball' or 'soccer'
        let currentTab = 'timer';
        let unit = 'kmh'; // 'kmh' or 'mph'
        let distance = 18.44; // default distance in meters
        
        // Timer mode state
        let timerState = 'IDLE'; // 'IDLE', 'WAITING_CATCH'
        let startTime = 0;
        let history = [];

        // Sport configurations
        const sportConfig = {
            baseball: {
                name: '野球',
                subtitle: '野球・ピッチング球速測定',
                icon: 'fa-baseball',
                heroLabel: 'Measured Pitch Speed',
                actionStart: 'リリースでタップ開始',
                actionEnd: 'キャッチしたらタップ！',
                hint: '💡 投げた瞬間（リリース）にタップし、キャッチした瞬間に再度タップしてください。',
                distances: [
                    { label: 'プロ・一般 (18.44m)', value: 18.44 },
                    { label: '中学・リトル (14.0m)', value: 14.0 },
                    { label: 'ピッチング練習用 (10.0m)', value: 10.0 },
                    { label: 'カスタム距離', value: 'custom' }
                ],
                frameLabel: 'ボールが移動している間のフレーム数'
            },
            soccer: {
                name: 'サッカー',
                subtitle: 'サッカー・シュートスピード測定',
                icon: 'fa-futbol',
                heroLabel: 'Measured Shot Speed',
                actionStart: 'シュートの瞬間にタップ開始',
                actionEnd: 'ゴール・キャッチでタップ！',
                hint: '💡 ボールを蹴った瞬間（インパクト）にタップし、ゴールまたはキャッチした瞬間に再度タップしてください。',
                distances: [
                    { label: 'ペナルティスポット〜ゴール (11.0m)', value: 11.0 },
                    { label: 'ペナルティエリア外・中距離 (16.0m)', value: 16.0 },
                    { label: 'フリーキック練習用 (20.0m)', value: 20.0 },
                    { label: 'カスタム距離', value: 'custom' }
                ],
                frameLabel: 'ボールが飛行している間のフレーム数'
            }
        };

        // Initialize distances on load
        window.onload = function() {
            updateSportUI();
        };

        // Switch Sport Function (handles setSport caller)
        function setSport(sport) {
            if (currentSport === sport) return;
            currentSport = sport;
            history = []; // Clear history on sport switch
            renderHistory();
            document.getElementById('speed-display').innerText = "---";
            document.getElementById('time-taken-display').innerText = "計測時間: --- 秒";
            updateSportUI();
        }

        // Alias for compatibility
        function switchSport(sport) {
            setSport(sport);
        }

        function updateSportUI() {
            const config = sportConfig[currentSport];
            
            // Highlight sport buttons
            const btnBb = document.getElementById('sport-baseball');
            const btnSc = document.getElementById('sport-soccer');
            const headerIconBg = document.getElementById('header-icon-bg');
            const headerIcon = document.getElementById('header-icon');
            const headerSubtitle = document.getElementById('header-subtitle');
            const bgWatermark = document.getElementById('bg-watermark');
            const speedLabelText = document.getElementById('speed-label-text');
            const btnText = document.getElementById('btn-text');
            const instructionHint = document.getElementById('instruction-hint');
            const historyIconColor = document.getElementById('history-icon-color');
            const videoFrameLabel = document.getElementById('video-frame-label');
            const heroCard = document.getElementById('hero-card');

            if (currentSport === 'baseball') {
                btnBb.className = "px-4 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-bold transition flex items-center space-x-1.5 shadow";
                btnSc.className = "px-4 py-1.5 rounded-lg text-slate-400 hover:text-white text-xs font-medium transition flex items-center space-x-1.5";
                headerIconBg.className = "bg-indigo-600 text-white p-2 rounded-xl shadow-lg shadow-indigo-500/30 transition-colors duration-300";
                heroCard.className = "bg-gradient-to-br from-slate-900 to-indigo-950/40 border border-slate-800 rounded-3xl p-6 md:p-10 shadow-2xl flex flex-col items-center justify-center text-center relative overflow-hidden transition-all duration-500";
                historyIconColor.className = "fa-solid fa-clock-rotate-left mr-2 text-indigo-400";
            } else {
                btnSc.className = "px-4 py-1.5 rounded-lg bg-emerald-600 text-white text-xs font-bold transition flex items-center space-x-1.5 shadow";
                btnBb.className = "px-4 py-1.5 rounded-lg text-slate-400 hover:text-white text-xs font-medium transition flex items-center space-x-1.5";
                headerIconBg.className = "bg-emerald-600 text-white p-2 rounded-xl shadow-lg shadow-emerald-500/30 transition-colors duration-300";
                heroCard.className = "bg-gradient-to-br from-slate-900 to-emerald-950/40 border border-slate-800 rounded-3xl p-6 md:p-10 shadow-2xl flex flex-col items-center justify-center text-center relative overflow-hidden transition-all duration-500";
                historyIconColor.className = "fa-solid fa-clock-rotate-left mr-2 text-emerald-400";
            }

            headerIcon.className = `fa-solid ${config.icon} text-xl`;
            headerSubtitle.innerText = config.subtitle;
            bgWatermark.innerHTML = `<i class="fa-solid ${config.icon}"></i>`;
            speedLabelText.innerText = config.heroLabel;
            if (timerState === 'IDLE') {
                btnText.innerText = config.actionStart;
            }
            instructionHint.innerText = config.hint;
            videoFrameLabel.innerText = config.frameLabel;

            // Populate distance dropdown
            const select = document.getElementById('distance-select');
            select.innerHTML = config.distances.map(d => `<option value="${d.value}">${d.label}</option>`).join('');
            
            updateDistance();
        }

        // Switch Tabs (Timer vs Video)
        function switchTab(tab) {
            currentTab = tab;
            const btnTimer = document.getElementById('tab-timer');
            const btnVideo = document.getElementById('tab-video');
            const secTimer = document.getElementById('section-timer');
            const secVideo = document.getElementById('section-video');

            const activeColor = currentSport === 'baseball' ? 'bg-indigo-600' : 'bg-emerald-600';

            if (tab === 'timer') {
                btnTimer.className = `px-3 py-1.5 rounded-lg transition ${activeColor} text-white shadow`;
                btnVideo.className = "px-3 py-1.5 rounded-lg transition text-slate-400 hover:text-white";
                secTimer.classList.remove('hidden');
                secVideo.classList.add('hidden');
            } else {
                btnVideo.className = `px-3 py-1.5 rounded-lg transition ${activeColor} text-white shadow`;
                btnTimer.className = "px-3 py-1.5 rounded-lg transition text-slate-400 hover:text-white";
                secVideo.classList.remove('hidden');
                secTimer.classList.add('hidden');
            }
        }

        // Update Distance selection
        function updateDistance() {
            const select = document.getElementById('distance-select');
            const customBox = document.getElementById('custom-distance-box');
            if (select.value === 'custom') {
                customBox.classList.remove('hidden');
                customBox.classList.add('flex');
                distance = parseFloat(document.getElementById('custom-distance').value) || 15;
            } else {
                customBox.classList.remove('flex');
                customBox.classList.add('hidden');
                distance = parseFloat(select.value);
            }
        }

        // Set Unit (kmh / mph)
        function setUnit(newUnit) {
            unit = newUnit;
            const btnKmh = document.getElementById('unit-kmh');
            const btnMph = document.getElementById('unit-mph');
            const unitDisplay = document.getElementById('unit-display');
            const activeColor = currentSport === 'baseball' ? 'bg-indigo-600' : 'bg-emerald-600';

            if (unit === 'kmh') {
                btnKmh.className = `px-3 py-1 rounded-lg ${activeColor} text-white font-medium transition`;
                btnMph.className = "px-3 py-1 rounded-lg text-slate-400 hover:text-white transition";
                unitDisplay.innerText = "km/h";
            } else {
                btnMph.className = `px-3 py-1 rounded-lg ${activeColor} text-white font-medium transition`;
                btnKmh.className = "px-3 py-1 rounded-lg text-slate-400 hover:text-white transition";
                unitDisplay.innerText = "mph";
            }
            
            if (history.length > 0) {
                updateSpeedDisplay(history[0].time);
            }
        }

        // Handle Timer Button Click
        function handleTimerClick() {
            const btn = document.getElementById('action-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');
            const config = sportConfig[currentSport];

            if (timerState === 'IDLE') {
                startTime = performance.now();
                timerState = 'WAITING_CATCH';
                
                const gradColor = currentSport === 'baseball' ? 'from-rose-600 to-orange-600 hover:from-rose-500 hover:to-orange-500 shadow-rose-600/30' : 'from-amber-600 to-red-600 hover:from-amber-500 hover:to-red-500 shadow-amber-600/30';
                btn.className = `w-full py-6 rounded-2xl bg-gradient-to-r ${gradColor} text-white font-bold text-xl md:text-2xl shadow-xl active:scale-[0.98] transition-all flex items-center justify-center space-x-3`;
                btnText.innerText = config.actionEnd;
                btnIcon.className = "fa-solid fa-hand text-2xl animate-pulse";
            } else {
                const endTime = performance.now();
                const timeSeconds = (endTime - startTime) / 1000.0;
                
                timerState = 'IDLE';
                const gradColor = currentSport === 'baseball' ? 'from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 shadow-indigo-600/30' : 'from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 shadow-emerald-600/30';
                btn.className = `w-full py-6 rounded-2xl bg-gradient-to-r ${gradColor} text-white font-bold text-xl md:text-2xl shadow-xl active:scale-[0.98] transition-all flex items-center justify-center space-x-3`;
                btnText.innerText = config.actionStart;
                btnIcon.className = "fa-solid fa-circle-play text-2xl";

                if (timeSeconds < 0.15 || timeSeconds > 4.0) {
                    alertBox("計測時間が不自然です（速すぎるか遅すぎます）。もう一度お試しください。");
                    return;
                }

                processMeasurement(timeSeconds);
            }
        }

        function processMeasurement(timeSeconds) {
            document.getElementById('time-taken-display').innerText = `計測時間: ${timeSeconds.toFixed(3)} 秒`;
            updateSpeedDisplay(timeSeconds);
            
            const speedVal = calculateSpeedValue(timeSeconds);
            history.unshift({ time: timeSeconds, speed: speedVal, unit: unit });
            if (history.length > 10) history.pop();
            renderHistory();
        }

        function calculateSpeedValue(timeSeconds) {
            const speedMs = distance / timeSeconds;
            let val = unit === 'kmh' ? speedMs * 3.6 : speedMs * 2.23694;
            return Math.round(val * 10) / 10;
        }

        function updateSpeedDisplay(timeSeconds) {
            const speedVal = calculateSpeedValue(timeSeconds);
            document.getElementById('speed-display').innerText = speedVal.toFixed(1);
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = `<div class="text-xs text-slate-500 italic px-2 py-3">まだ測定データはありません</div>`;
                return;
            }

            const badgeColor = currentSport === 'baseball' ? 'text-indigo-400' : 'text-emerald-400';

            list.innerHTML = history.map((item, idx) => `
                <div class="flex-shrink-0 bg-slate-800 border border-slate-700/60 rounded-xl p-3 min-w-[100px] text-center">
                    <div class="text-[10px] text-slate-400">#${history.length - idx}</div>
                    <div class="speed-font text-xl font-bold ${badgeColor}">${item.speed}</div>
                    <div class="text-[10px] text-slate-500">${item.unit}</div>
                </div>
            `).join('');
        }

        function clearHistory() {
            history = [];
            renderHistory();
            document.getElementById('speed-display').innerText = "---";
            document.getElementById('time-taken-display').innerText = "計測時間: --- 秒";
        }

        // Video frame analysis calculation
        function calculateVideoSpeed() {
            const fps = parseFloat(document.getElementById('video-fps').value);
            const frames = parseFloat(document.getElementById('frame-count').value);

            if (!frames || frames <= 0) {
                alertBox("有効なフレーム数を入力してください。");
                return;
            }

            const timeSeconds = frames / fps;
            const speedVal = calculateSpeedValue(timeSeconds);

            const resultBox = document.getElementById('video-result-box');
            const speedValElem = document.getElementById('video-speed-val');
            
            resultBox.classList.remove('hidden');
            speedValElem.innerText = `${speedVal.toFixed(1)} ${unit}`;
        }

        // Custom Safe Alert Box
        function alertBox(message) {
            const div = document.createElement('div');
            div.className = "fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4";
            div.innerHTML = `
                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center">
                    <div class="text-amber-400 text-3xl mb-3"><i class="fa-solid fa-triangle-exclamation"></i></div>
                    <p class="text-sm text-slate-200 mb-5">${message}</p>
                    <button onclick="this.closest('.fixed').remove()" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-medium text-sm">確認</button>
                </div>
            `;
            document.body.appendChild(div);
        }
    </script>
</body>
</html>
